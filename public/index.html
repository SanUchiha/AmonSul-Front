<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <script>
      // Solo en la app, que ocupa toda la pantalla: en la web, un iPhone con muesca metería el contenido debajo de ella.
      // Aquí y no en main.ts porque Capacitor lee esta etiqueta en cuanto la página empieza a pintarse
      if (window.Capacitor && window.Capacitor.isNativePlatform()) {
        document.querySelector("meta[name=viewport]").content += ",viewport-fit=cover";
      }
    </script>
    <link rel="icon" href="<%= BASE_URL %>favicon.svg">
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
